spring:
  datasource:
    url: jdbc:h2:mem:devsynctest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# JWT test configuration — values are for testing only and must never be used in production.
# Secret is a Base64-encoded 48-byte value (384 bits), satisfying HMAC-SHA256 minimum requirements.
app:
  jwt:
    secret: dGVzdC1kZXZzeW5jLWp3dC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktZG8tbm90LXVzZS1pbi1wcm9k
    expiration-ms: 3600000
  coding:
    integration:
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
      codeforces:
        base-url: https://codeforces.com/api
        enabled: true
      github:
        base-url: https://api.github.com
        enabled: true
      leetcode:
        base-url: https://leetcode.com/graphql
        enabled: true
      codechef:
        base-url: https://api.codechef.com
        enabled: false
      hackerrank:
        base-url: https://www.hackerrank.com/api
        enabled: false
      atcoder:
        base-url: https://atcoder.jp/api
        enabled: false
    sync:
      enabled: false
      fixed-delay-ms: 60000
      initial-delay-ms: 10000
      max-concurrent-workers: 2
    reliability:
      rate-limit:
        enabled: true
        platforms:
          CODEFORCES:
            capacity: 50
            refill-rate-per-second: 50.0
          GITHUB:
            capacity: 50
            refill-rate-per-second: 50.0
          LEETCODE:
            capacity: 50
            refill-rate-per-second: 50.0
          CODECHEF:
            capacity: 50
            refill-rate-per-second: 50.0
          HACKERRANK:
            capacity: 50
            refill-rate-per-second: 50.0
          ATCODER:
            capacity: 50
            refill-rate-per-second: 50.0
      cache:
        enabled: true
        ttl-seconds: 60
        max-entries: 100
      retry:
        enabled: true
        max-attempts: 3
        initial-backoff-ms: 10
        max-backoff-ms: 50
        jitter-factor: 0.0
