spring:
  application:
    name: devsync
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devsync}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# JWT Authentication Configuration
# JWT_SECRET: Must be a Base64-encoded string whose decoded bytes are >= 32 bytes (256 bits)
#             for HMAC-SHA256. Never hardcode a production value here; always inject via
#             environment variable. Generate with: openssl rand -base64 48
# JWT_EXPIRATION: Token validity in milliseconds. Default 86400000 = 24 hours.
#             Reduce in production (e.g. 3600000 = 1 h) and pair with refresh tokens (Phase A4).
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}
